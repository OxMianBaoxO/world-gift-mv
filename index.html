<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>窗花 · 世界赠予我的 MV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="start">
  <div class="s-box">
    <div class="s-seal">窗花</div>
    <div class="s-title">世界赠予我的</div>
    <div class="s-song">王菲 · MV · 代码生成的 MG 动画</div>
    <div class="s-status" id="status">正在剪窗花…</div>
    <div class="s-buttons">
      <button id="btnFull" disabled>▶ 全屏放映</button>
      <button id="btnWin" class="ghost" disabled>窗口播放</button>
    </div>
    <label class="s-file" id="fileWrap" hidden>没找到 assets/song.flac？<input type="file" id="file" accept="audio/*"> 手动选择音频</label>
    <div class="s-hint">空格 暂停 · F 全屏 · ← → 快退快进 5 秒 · 1～5 跳到各段 · D 显示镜号</div>
  </div>
</div>

<div id="hud">
  <div id="bar"><div id="played"></div><div id="marks"></div></div>
  <div class="row">
    <button id="btnPlay" class="icon">❚❚</button>
    <span id="time">0:00 / 4:04</span>
    <span id="chapter"></span>
    <span class="spacer"></span>
    <button id="btnFs" class="icon">⛶</button>
  </div>
</div>
<div id="debug" hidden></div>

<script src="js/audio-data.js"></script>
<script src="js/core.js"></script>
<script src="js/draw.js"></script>
<script src="js/papercut.js"></script>
<script src="js/figure.js"></script>
<script src="js/props.js"></script>
<script src="js/world.js"></script>
<script src="js/lrc.js"></script>
<script src="js/lyric-timing.js"></script>
<script src="js/type.js"></script>
<script src="js/director.js"></script>
<script src="js/shots-1.js"></script>
<script src="js/shots-2.js"></script>
<script src="js/shots-3.js"></script>
<script src="js/shots-4.js"></script>
<script src="js/app.js"></script>
</body>
</html>
